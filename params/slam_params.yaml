slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: "mapping"
    resolution: 0.05               # was 0.02 — 4x fewer cells, big CPU/RAM win on the SBC
    map_update_interval: 2.0        # was 1.0 — rebuild the map half as often
    # TRUE: this base has MECANUM wheels whose odometry drifts badly — especially
    # rotating in place during the search spin — so pure odometry (false) drifted
    # and was worse, not better.  We NEED scan-matching to correct mecanum drift.
    # The SBC has spare CPU (~70% idle; "queue is full" was DDS scan delivery, not
    # compute), so the fidelity settings below are restored to proper (not
    # coarsened) values so each processed scan matches well and pulls map->odom
    # back onto the walls.
    use_scan_matching: true
    map_topic: /map
    scan_topic: /scan_filtered

    # TF frame names — base_footprint matches the static TF chain:
    # odom → base_link (from planar_move) → base_footprint (from static TF)
    base_frame: base_link      # was base_footprint (sim-only synthetic frame); base_link
                               # exists in both sim and the real robot, and matches Nav2's
                               # robot_base_frame + shuttle_manager — so no base_footprint needed.
    odom_frame: odom
    map_frame: map

    # Transform settings
    transform_publish_period: 0.02   # 50 Hz map→odom transform
    transform_timeout: 0.5
    tf_buffer_duration: 30.0         # hold more TF history so late scans still resolve

    # Add graph nodes often enough to actually track motion during the short run.
    minimum_travel_distance: 0.1     # metres before adding a new scan
    minimum_travel_heading: 0.2      # radians before adding a new scan
    # DDS delivery (not CPU) limits scan rate; process every 2nd scan.
    throttle_scans: 2

    # Proper scan-matching fidelity (restored from an over-aggressive CPU-saving
    # coarsening that made matches bad and map->odom jumpy).  The SBC has spare
    # CPU, and good matches with a WIDE search window are what recover from the
    # poor mecanum odometry between scans.
    do_loop_closing: true
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    scan_buffer_size: 10

    debug_logging: false
