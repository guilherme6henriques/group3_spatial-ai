slam_toolbox:
  ros__parameters:
    use_sim_time: true
    mode: "mapping"
    resolution: 0.05               # was 0.02 — 4x fewer cells, big CPU/RAM win on the SBC
    map_update_interval: 2.0        # was 1.0 — rebuild the map half as often
    # FALSE on this robot: the SBC can't run scan-matching fast enough, so it
    # dropped scans and made BAD corrections that jerked map->odom around — a
    # bolted marker smeared across a 1.5 m circle and Nav2 chased a sliding goal.
    # The wheel odometry (odom->base_link) is fresh and accurate (~29 ms), so we
    # trust it: map->odom stays smooth, the marker stays put, and the goal is
    # stable. Drift over a short A<->B run in a small arena is negligible. This
    # also drops the per-scan Ceres cost that was pegging a core ("queue is full").
    use_scan_matching: false
    map_topic: /map
    scan_topic: /scan_filtered

    # TF frame names — base_footprint matches the static TF chain:
    # odom → base_link (from planar_move) → base_footprint (from static TF)
    base_frame: base_link      # was base_footprint (sim-only synthetic frame); base_link
                               # exists in both sim and the real robot, and matches Nav2's
                               # robot_base_frame + shuttle_manager — so no base_footprint needed.
    odom_frame: odom
    map_frame: map

    # Transform settings
    transform_publish_period: 0.02   # 50 Hz map→odom transform
    transform_timeout: 0.5
    tf_buffer_duration: 30.0         # hold more TF history so late scans still resolve

    # Scan matching thresholds — add graph nodes less often (cheaper optimisation).
    minimum_travel_distance: 0.2     # metres before adding a new scan
    minimum_travel_heading: 0.3      # radians before adding a new scan
    # On the real robot's CPU, processing every 10 Hz scan overruns slam_toolbox
    # ("Message Filter dropping … queue is full").  Process every 3rd scan (~3 Hz).
    throttle_scans: 3

    # ── CPU: the scan-matching pegs one ARM core, so SLAM fell behind, dropped
    #    scans, and barely grew the map (70x49 ≈ 3.5x2.45 m) — then every Nav2
    #    goal was "off the global costmap" and planning always failed.  Cut the
    #    per-scan cost so SLAM keeps up and the map covers the arena.
    do_loop_closing: false                       # skip the 8 m loop-closure search (not needed for a small A<->B area)
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.03    # was 0.01 default → ~9x fewer correlation cells per scan
    correlation_search_space_smear_deviation: 0.03
    scan_buffer_size: 5                           # keep fewer recent scans in the running matcher

    debug_logging: false
